server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_vary on;
  gzip_min_length 1024;

  # No Content-Security-Policy on purpose: Starlight and the mermaid runner rely
  # on inline scripts, so a useful CSP needs hashes/nonces coordinated with the
  # build output. Revisit if that pipeline ever emits external-only scripts.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    # add_header in a location suppresses inherited headers: repeat them here.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    return 200 "ok\n";
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # add_header in a location suppresses inherited headers: repeat them here.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  location /en/ {
    error_page 404 /en/404/index.html;
    try_files $uri $uri/ $uri/index.html =404;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
